# ═══════════════════════════════════════════════════════════════
# Sports Bot v2 — Docker Compose
# ═══════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # Follow app logs
#   docker compose down           # Stop all services
#

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../screenshots:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://sportsbot:${POSTGRES_PASSWORD}@postgres:5432/sportsbot

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sportsbot
      POSTGRES_USER: sportsbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbot -d sportsbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
