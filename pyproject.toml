[project]
name = "sports-bot-v2"
version = "2.0.0"
description = "Agentic sports slot booking bot with LLM-driven browser automation"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samay" }]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",

    # Database
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # LLM-driven browser agent
    "browser-use>=0.13",
    "langchain-google-genai>=2.1",

    # Scheduling
    "APScheduler>=3.11,<4.0",

    # Security
    "cryptography>=44.0",

    # HTTP client (for Telegram)
    "httpx>=0.28",

    # Config
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",

    # Templates
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
